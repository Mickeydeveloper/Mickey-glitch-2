<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mickey Glitch 2 | WhatsApp Bot Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
  :root{--bg:#0a0a0f;--card:rgba(255,255,255,.04);--stroke:rgba(255,255,255,.1);--orange:#ff6b1a;--pink:#ff2e88;--text:#fff;--text-2:#a8a8b8;--text-3:#737386;--success:#22e07a;--danger:#ff3b5c;--radius:24px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden;}
  .auth-screen{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,10,15,.96);}
  .auth-card{width:min(440px,100%);padding:34px;border:1px solid var(--stroke);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));}
  .auth-card h2{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;margin-bottom:8px;}
  .auth-card p{color:var(--text-2);font-size:.9rem;margin-bottom:24px;}
  .auth-card .auth-error{display:none;color:var(--danger);font-size:.8rem;margin-top:12px;}
  .auth-card .auth-error.show{display:block;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .field label{font-size:.78rem;font-weight:600;color:var(--text-2);}
  .field input{padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--stroke);color:var(--text);font-size:.88rem;}
  .field input:focus{outline:none;border-color:var(--orange);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border-radius:14px;border:none;cursor:pointer;font-weight:600;font-size:.9rem;background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;}
  .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--orange),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;color:#fff;margin-bottom:18px;}
  body.authenticated .auth-screen{display:none;}
  .main{display:none;padding:40px;}
  body.authenticated .main{display:block;}
  </style>
</head>
<body>

<!-- AUTH SCREEN -->
<section class="auth-screen" id="authScreen">
  <form class="auth-card" id="authForm">
    <div class="logo">MG</div>
    <h2>Welcome back</h2>
    <p>Login with your phone number to manage up to two WhatsApp bots.</p>
    <div class="field">
      <label for="accountPhone">Phone number</label>
      <input type="tel" id="accountPhone" placeholder="e.g. 255712345678" required>
    </div>
    <div class="field">
      <label for="accountName">Account name (optional)</label>
      <input type="text" id="accountName" placeholder="Your name" maxlength="60">
    </div>
    <button class="btn" id="authSubmit" type="submit" style="width:100%;">
      <i class="fas fa-right-to-bracket"></i> Login / Create account
    </button>
    <div class="auth-error" id="authError"></div>
  </form>
</section>

<!-- MAIN (baada ya login) -->
<div class="main" id="mainApp">
  <h1>Karibu kwenye Dashboard yako!</h1>
  <p>Umeingia kikamilifu. Unaweza kuanza kuunganisha bots zako.</p>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ============================================================
   TANGAZA VARIABLE ZOTE HAPA JUU KABLA YA MATUMIZI
   ============================================================ */
var socket = null;
var accountToken = localStorage.getItem('mickey_account_token') || '';

try {
  socket = io();
} catch (e) {
  console.warn('Socket.IO haipatikani:', e.message);
}

/* ============================================================
   HELPER FUNCTIONS
   ============================================================ */
function normalizePhone(value) {
  var phone = String(value || '').trim().replace(/\D/g, '');
  if (phone.startsWith('00')) phone = phone.slice(2);
  if (phone.startsWith('0')) phone = '255' + phone.slice(1);
  if (phone.length === 9) phone = '255' + phone;
  return phone;
}

function isValidTanzaniaPhone(phone) {
  return /^255[67]\d{8}$/.test(phone);
}

function showAuthError(message) {
  var el = document.getElementById('authError');
  el.textContent = message;
  el.classList.add('show');
  console.error('[Auth Error]', message);
}

/* ============================================================
   LOGIN FORM
   ============================================================ */
var authForm = document.getElementById('authForm');
var authSubmit = document.getElementById('authSubmit');

authForm.addEventListener('submit', function(event) {
  event.preventDefault();

  var rawPhone = document.getElementById('accountPhone').value;
  var name = document.getElementById('accountName').value.trim();
  var phone = normalizePhone(rawPhone);

  console.log('[Login] Raw phone:', rawPhone);
  console.log('[Login] Normalized phone:', phone);

  if (!isValidTanzaniaPhone(phone)) {
    showAuthError('Namba si sahihi. Tumia mfano: 255712345678 (bila +).');
    return;
  }

  authSubmit.disabled = true;
  authSubmit.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Inaingia...';
  document.getElementById('authError').classList.remove('show');

  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: phone, name: name })
  })
  .then(function(response) {
    return response.json().then(function(data) {
      return { ok: response.ok, data: data };
    });
  })
  .then(function(result) {
    if (!result.ok) {
      throw new Error(result.data.error || 'Login imeshindikana.');
    }

    accountToken = result.data.token;
    localStorage.setItem('mickey_account_token', accountToken);
    console.log('[Login] Token saved:', accountToken);

    // Onyesha dashboard
    document.body.classList.add('authenticated');

    // Tuma token kwa socket
    if (socket) {
      socket.emit('account-auth', accountToken);
    }

    authSubmit.disabled = false;
    authSubmit.innerHTML = '<i class="fas fa-right-to-bracket"></i> Login / Create account';
  })
  .catch(function(error) {
    console.error('[Login] Error:', error);
    showAuthError(error.message || 'Kuna tatizo. Jaribu tena.');
    authSubmit.disabled = false;
    authSubmit.innerHTML = '<i class="fas fa-right-to-bracket"></i> Login / Create account';
  });
});

/* ============================================================
   SOCKET EVENTS
   ============================================================ */
if (socket) {
  socket.on('connect', function() {
    console.log('[Socket] Connected');
    if (accountToken) {
      socket.emit('account-auth', accountToken);
    }
  });

  socket.on('account-auth-success', function(payload) {
    console.log('[Socket] Auth success:', payload);
    document.body.classList.add('authenticated');
  });

  socket.on('account-auth-fail', function(message) {
    console.warn('[Socket] Auth failed:', message);
    accountToken = '';
    localStorage.removeItem('mickey_account_token');
    document.body.classList.remove('authenticated');
    showAuthError(message || 'Session imeisha. Tafadhali login tena.');
  });
}

console.log('[System] Script imepakiwa vizuri.');
</script>
</body>
</html>
