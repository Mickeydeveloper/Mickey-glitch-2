services:
  - type: web
    name: mickey-glitch
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOW_RESOURCE_MODE
        value: "true"
      - key: ENABLE_TELEGRAM
        value: "false"
      - key: MAX_MEDIA_MB
        value: "8"
